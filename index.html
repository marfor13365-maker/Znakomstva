<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Znakomstor — Настоящие знакомства рядом</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Inter:wght@400;500;600&display=swap');
:root{--bg:#0d0d0d;--card:#161616;--border:#2a2a2a;--accent:#ff1744;--accent2:#ff5252;--text:#f0f0f0;--muted:#aaa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:'Inter',sans-serif;color:var(--text)}

/* ===== ВИДЕО НА ВЕСЬ ЭКРАН, БЕЗ ВТОРОЙ СЦЕНЫ И ПОДСКАЗОК ===== */
.video-wrap{position:fixed;inset:0}
.video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.video-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 75%,rgba(0,0,0,0.3) 100%);pointer-events:none}
.mute-btn{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));right:20px;z-index:5;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.25);color:#fff;width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ===== ТОПБАР ===== */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 20px 16px}
.brand{display:flex;align-items:center;gap:9px}
.brand-name{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:0 2px 12px rgba(0,0,0,0.5)}
.menu-btn{background:rgba(0,0,0,0.4);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.25);color:#fff;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ===== ВЫПАДАЮЩЕЕ МЕНЮ ===== */
.nav-panel{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;background:var(--card);border-left:1px solid var(--border);z-index:40;transform:translateX(100%);transition:transform 0.32s cubic-bezier(.2,.8,.2,1);padding:calc(24px + env(safe-area-inset-top)) 24px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.nav-panel.open{transform:translateX(0)}
.nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:35;opacity:0;pointer-events:none;transition:opacity 0.3s}
.nav-overlay.open{opacity:1;pointer-events:auto}
.nav-close{align-self:flex-end;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;margin-bottom:18px;width:34px;height:34px}
.nav-logo{width:64px;height:64px;margin-bottom:14px}
.nav-panel .brand-name{font-size:20px;margin-bottom:6px;text-shadow:none}
.nav-tagline{font-size:12px;color:var(--muted);margin-bottom:32px}
.nav-btn{display:block;width:100%;text-align:center;padding:15px;border-radius:14px;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;text-decoration:none;margin-bottom:12px;cursor:pointer;border:none;color:var(--text)}
.nav-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.nav-btn.secondary{background:transparent;border:1px solid var(--border)}
.nav-footer{margin-top:auto;font-size:11px;color:var(--muted);text-align:center;line-height:1.8}
.nav-footer a{color:var(--muted)}
</style>
</head>
<body>

<div class="topbar">
<div class="brand">
<svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
<defs>
<linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fe37a"/><stop offset="1" stop-color="#0fa958"/></linearGradient>
<clipPath id="cl1"><rect x="0" y="0" width="50" height="100"/></clipPath>
<clipPath id="cr1"><rect x="50" y="0" width="50" height="100"/></clipPath>
</defs>
<circle cx="50" cy="50" r="48" fill="url(#bg1)"/>
<path id="ph1" d="M50 76 C 26 58, 18 42, 27 30 C 34 21, 46 22, 50 33 C 54 22, 66 21, 73 30 C 82 42, 74 58, 50 76 Z"/>
<use href="#ph1" clip-path="url(#cl1)" fill="#3fb7ff"/>
<use href="#ph1" clip-path="url(#cr1)" fill="#ff4d9d"/>
</svg>
<span class="brand-name">Znakomstor</span>
</div>
<button class="menu-btn" onclick="openNav()" aria-label="Меню">☰</button>
</div>

<div class="nav-overlay" id="nav-overlay" onclick="closeNav()"></div>
<div class="nav-panel" id="nav-panel">
<button class="nav-close" onclick="closeNav()">✕</button>
<svg class="nav-logo" viewBox="0 0 100 100" aria-hidden="true">
<defs>
<linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fe37a"/><stop offset="1" stop-color="#0fa958"/></linearGradient>
<clipPath id="cl2"><rect x="0" y="0" width="50" height="100"/></clipPath>
<clipPath id="cr2"><rect x="50" y="0" width="50" height="100"/></clipPath>
</defs>
<circle cx="50" cy="50" r="48" fill="url(#bg2)"/>
<path id="ph2" d="M50 76 C 26 58, 18 42, 27 30 C 34 21, 46 22, 50 33 C 54 22, 66 21, 73 30 C 82 42, 74 58, 50 76 Z"/>
<use href="#ph2" clip-path="url(#cl2)" fill="#3fb7ff"/>
<use href="#ph2" clip-path="url(#cr2)" fill="#ff4d9d"/>
</svg>
<div class="brand-name">Znakomstor</div>
<div class="nav-tagline">Настоящие знакомства рядом</div>
<a class="nav-btn primary" href="login.html">Войти</a>
<a class="nav-btn secondary" href="login.html#register">Регистрация</a>
<a class="nav-btn secondary" href="reviews.html">⭐ Отзывы</a>
<a class="nav-btn secondary" href="rules.html">📜 Правила</a>
<div class="nav-footer">
<div>Сделано в <a href="https://vektorizi-ru.vercel.app/" target="_blank" rel="noopener">Студии Вектор</a></div>
</div>
</div>

<div class="video-wrap">
<video id="hero-video" src="landing-video-6.mp4" autoplay muted loop playsinline preload="auto"></video>
<div class="video-shade"></div>
<button class="mute-btn" id="mute-btn" onclick="toggleMute()">🔇</button>
</div>

<script>
var video = document.getElementById('hero-video');

function openNav() {
document.getElementById('nav-panel').classList.add('open');
document.getElementById('nav-overlay').classList.add('open');
}
function closeNav() {
document.getElementById('nav-panel').classList.remove('open');
document.getElementById('nav-overlay').classList.remove('open');
}

function toggleMute() {
video.muted = !video.muted;
document.getElementById('mute-btn').textContent = video.muted ? '🔇' : '🔊';
}

video.play().catch(function() {});
</script>
</body>
</html>
